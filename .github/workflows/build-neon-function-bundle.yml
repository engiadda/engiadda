name: Build Neon Jobs API bundle

on:
  push:
    branches: [main]
    paths:
      - "functions/jobs.js"
      - "package.json"
      - ".github/workflows/build-neon-function-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle Neon Function
        run: |
          npx --yes esbuild@0.25.10 functions/jobs.js --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=dist/index.mjs
          zip -j dist/function.zip dist/index.mjs
      - name: Emit bundle for deployment
        run: |
          echo "ZIP_B64_BEGIN"
          base64 -w 30000 dist/function.zip
          echo "ZIP_B64_END"
