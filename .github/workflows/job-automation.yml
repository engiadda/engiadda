name: EngiAdda Job Alert Automation

on:
  schedule:
    # 08:00 IST = 02:30 UTC; 19:00 IST = 13:30 UTC
    - cron: '30 2 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: engiadda-job-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: job-automation/requirements.txt

      - name: Install dependencies
        run: pip install -r job-automation/requirements.txt

      - name: Run job intelligence scan
        env:
          TIMEZONE: Asia/Kolkata
          DATABASE_PATH: job-automation/data/jobs.db
          SOURCES_PATH: job-automation/config/sources.json
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'false' }}
          ENABLE_WEBSITE: ${{ secrets.ENABLE_WEBSITE || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSITE_API_URL: ${{ secrets.WEBSITE_API_URL }}
          WEBSITE_API_TOKEN: ${{ secrets.WEBSITE_API_TOKEN }}
        run: python job-automation/app.py

      - name: Persist SQLite state
        run: |
          git config user.name "engiadda-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add job-automation/data/jobs.db
          git diff --cached --quiet || git commit -m "chore: persist job automation state"
          git push
